<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | Eliot's Portfolio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100" style="background-color: #e7edf3;">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <div class="navbar-nav mx-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="portfolio.html">Portfolio</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                    <a class="nav-link" href="signin.html">Sign In</a>
                    <a class="nav-link active" href="signup.html">Sign Up</a>
                </div>
            </div>
        </nav>

        <div class="container my-5">
            <div class="text-center">
                <h1>Sign up here!</h1>
                <hr>
            </div>

            <div class="row justify-content-center mt-4">
                <div class="col-md-6">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">
                                    First Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    required
                                >
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">
                                    Last Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    required
                                >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                >
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                required
                            >
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-dark">
                                Sign Up
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-center py-3 mt-auto">
            <a class="text-white mx-3" href="terms.html">
                Terms and Conditions
            </a>
            <a class="text-white mx-3" href="privacy.html">
                Privacy Policy
            </a>
            <a class="text-white mx-3" href="cookies.html">
                Cookie Policy
            </a>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    </body>
</html>
