<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact | Eliot's Portfolio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100" style="background-color: #e7edf3;">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <div class="navbar-nav mx-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="portfolio.html">Portfolio</a>
                    <a class="nav-link active" href="contact.html">Contact</a>
                    <a class="nav-link" href="signin.html">Sign In</a>
                    <a class="nav-link" href="signup.html">Sign Up</a>
                </div>
            </div>
        </nav>

        <div class="container my-5">

            <div class="text-center">
                <h1>How can I contact you?</h1>
                <hr>
            </div>

            <form class="mt-4">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">
                            First Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="firstName"
                            name="firstName"
                            required
                        >
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">
                            Last Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="lastName"
                            name="lastName"
                            required
                        >
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">
                        Phone Number
                    </label>
                    <input
                        type="tel"
                        class="form-control"
                        id="phone"
                        name="phone"
                    >
                </div>

                <button type="submit" class="btn btn-dark">
                    Submit
                </button>
            </form>

            <section class="mt-5">
                <h2 class="text-center">Location</h2>

                <div class="text-center mt-3">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3166.438314465163!2d-116.98539282340442!3d46.71637264902653!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54a0270c0798ca01%3A0x1b7582c007c25667!2s2158%20Bloom%20Ave%2C%20Moscow%2C%20ID%2083843!5e1!3m2!1sen!2sus!4v1790741751609!5m2!1sen!2sus"
                            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>
            </section>
        </div>

        <footer class="bg-dark text-center py-3 mt-auto">
            <a class="text-white mx-3" href="terms.html">
                Terms and Conditions
            </a>

            <a class="text-white mx-3" href="privacy.html">
                Privacy Policy
            </a>

            <a class="text-white mx-3" href="cookies.html">
                Cookie Policy
            </a>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    </body>
</html>
